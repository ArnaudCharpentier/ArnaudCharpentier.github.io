<div class="prestation">
  <a class="js-scroll-trigger text-decoration-none" [href]="anchor">
    <h3 class="h4 my-3 text-uppercase {{cssClass}}">{{title}}</h3>
    <div class="picture-container">
      <img src="assets/img/{{icon}}.jpg" class="w-100" alt="{{icon}} asset image">
    </div>
    <ul class="my-3">
      @for (entry of description | liste; track entry) {
        <li class="prestation-detail">
          <i class="fa fa-angle-right"></i> {{entry}}
        </li>
      }
    </ul>
    <div class="my-3">
      @for (entry of footer | liste; track entry) {
        <span>
          {{entry}} <br>
        </span>
      }
    </div>
  </a>
</div>
